x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${ARGUS_POSTGRES_PASSWORD:-argus}
    volumes:
      - ${ARGUS_POSTGRES_DATA_PATH:-postgres-data}:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
      - ${ARGUS_BACKUP_DATA_PATH:-backup-data}:/backups:ro
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=5
      - -c
      - max_replication_slots=5
      - -c
      - wal_keep_size=${ARGUS_DR_POSTGRES_WAL_KEEP_SIZE:-2GB}
      - -c
      - hot_standby=on
      - -c
      - password_encryption=scram-sha-256
    ports:
      - "${ARGUS_DR_REPLICATION_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  clickhouse:
    image: clickhouse/clickhouse-server:26.3
    environment:
      CLICKHOUSE_DB: argus
      CLICKHOUSE_USER: argus
      CLICKHOUSE_PASSWORD: ${ARGUS_CLICKHOUSE_PASSWORD:-change-me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ${ARGUS_CLICKHOUSE_DATA_PATH:-clickhouse-data}:/var/lib/clickhouse
      - ./infra/clickhouse:/docker-entrypoint-initdb.d:ro
      - ./infra/clickhouse/backup_disk.xml:/etc/clickhouse-server/config.d/backup_disk.xml:ro
      - ${ARGUS_BACKUP_DATA_PATH:-backup-data}:/var/lib/clickhouse/backups
    ports:
      - "${ARGUS_DR_REPLICATION_BIND:-127.0.0.1}:8123:8123"
      - "${ARGUS_DR_REPLICATION_BIND:-127.0.0.1}:9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user argus --password \"$$CLICKHOUSE_PASSWORD\" --query \"SELECT 1\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *default-logging

  api:
    build: .
    hostname: ${ARGUS_DR_LOCAL_HOSTNAME:-argus-dc-a}
    command: ["node", "dist/api/main.js"]
    env_file: ${ARGUS_ENV_FILE:-.env}
    environment:
      ARGUS_CONTINUITY_CONTROL_PATH: /var/lib/argus/control
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "${ARGUS_API_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - ${ARGUS_BACKUP_DATA_PATH:-backup-data}:/var/lib/argus/backups:ro
      - ${ARGUS_CONTINUITY_CONTROL_PATH:-/var/lib/logvault/control}:/var/lib/argus/control
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging

  collector:
    build: .
    command: ["node", "dist/collector/main.js"]
    env_file: ${ARGUS_ENV_FILE:-.env}
    environment:
      ARGUS_NETFLOW_HOST: ${ARGUS_COLLECTOR_BIND:-127.0.0.1}
      ARGUS_SYSLOG_HOST: ${ARGUS_COLLECTOR_BIND:-127.0.0.1}
      ARGUS_SYNC_URL: http://127.0.0.1:8080/v1/ingest/batches
      ARGUS_HEARTBEAT_URL: http://127.0.0.1:8080/v1/ingest/heartbeat
      ARGUS_MANAGED_CLOUD_REGISTRY_URL: http://127.0.0.1:8080/v1/ingest/managed-cloud/registry
    depends_on:
      api:
        condition: service_healthy
    network_mode: host
    volumes:
      - ${ARGUS_COLLECTOR_DATA_PATH:-collector-data}:/var/lib/argus
    restart: unless-stopped
    logging: *default-logging

  web:
    image: nginx:1.28-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ARGUS_WEB_BIND:-127.0.0.1}:8081:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
    logging: *default-logging

  proxy:
    image: caddy:2.11.4-alpine
    env_file: ${ARGUS_ENV_FILE:-.env}
    environment:
      ARGUS_PROXY_UPSTREAM: web:80
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${ARGUS_HTTP_BIND:-0.0.0.0}:80:80"
      - "${ARGUS_HTTPS_BIND:-0.0.0.0}:443:443"
    volumes:
      - ./infra/caddy/${ARGUS_PROXY_CONFIG:-Caddyfile.http}:/etc/caddy/Caddyfile:ro
      - ${ARGUS_PROXY_DATA_PATH:-proxy-data}:/data
      - ${ARGUS_PROXY_CONFIG_PATH:-proxy-config}:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped
    logging: *default-logging

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    env_file: ${ARGUS_ENV_FILE:-.env}
    environment:
      ARGUS_BACKUP_ROOT: /backups
      ARGUS_BACKUP_INTERVAL_HOURS: ${ARGUS_BACKUP_INTERVAL_HOURS:-24}
      ARGUS_BACKUP_RETENTION_DAYS: ${ARGUS_BACKUP_RETENTION_DAYS:-15}
      ARGUS_BACKUP_FULL_INTERVAL_DAYS: ${ARGUS_BACKUP_FULL_INTERVAL_DAYS:-7}
      ARGUS_BACKUP_REMOTE_TARGET: ${ARGUS_BACKUP_REMOTE_TARGET:-}
      ARGUS_BACKUP_REMOTE_PORT: ${ARGUS_BACKUP_REMOTE_PORT:-22}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    volumes:
      - ${ARGUS_BACKUP_DATA_PATH:-backup-data}:/backups
      - ${ARGUS_COLLECTOR_DATA_PATH:-collector-data}:/var/lib/argus
      - ./infra/backup/ssh:/run/secrets:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/backups/LAST_SUCCESS.json"]
      interval: 1m
      timeout: 5s
      retries: 2
      start_period: 2m
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres-data:
  clickhouse-data:
  collector-data:
  backup-data:
  proxy-data:
  proxy-config:
